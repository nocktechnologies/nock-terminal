name: Anvil (Codex Security Review)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  anvil-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Require OpenAI API credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Run Codex security review
        id: anvil
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          effort: high
          output-file: ${{ runner.temp }}/anvil-output.md
          prompt: |
            Perform a security-focused adversarial review of this pull request.

            Base SHA: ${{ github.event.pull_request.base.sha }}
            Head SHA: ${{ github.event.pull_request.head.sha }}

            Review only changes introduced by the pull request. Inspect the diff and enough surrounding code to prove reachability. Prioritize authentication and authorization bypasses, command or path injection, unsafe IPC, secret exposure, dependency and workflow supply-chain risk, and destructive failure modes.

            Report only concrete, actionable findings. For each finding include severity, file, line, exploit path, and the smallest correct remediation. Do not speculate or report style issues. If there are no security findings, say that explicitly. Do not modify the repository.

      - name: Post Anvil review comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ANVIL_OUTPUT: ${{ runner.temp }}/anvil-output.md
          ANVIL_OUTCOME: ${{ steps.anvil.outcome }}
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync(process.env.ANVIL_OUTPUT, 'utf8').trim();
            } catch {
              output = 'Security review failed before producing output. This check is blocking; inspect the workflow logs.';
            }
            const rendered = output.slice(0, 58000).split('\n').map(line => `    ${line}`).join('\n');
            const body = [
              '## Anvil Security Review (Codex)',
              '',
              `Workflow outcome: **${process.env.ANVIL_OUTCOME || 'unknown'}**`,
              '',
              rendered || '    No review output was produced.',
              '',
              '*Adversarial security audit powered by OpenAI Codex. Does not replace human review.*',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
