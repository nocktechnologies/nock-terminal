name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run release:check

  build-mac:
    name: Build macOS (signed)
    runs-on: macos-latest
    needs: preflight
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify macOS signing and notarization secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$MACOS_CERTIFICATE"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Build React frontend
        run: npx vite build

      - name: Check bundle budget
        run: npm run check:bundle

      # electron-builder's own keychain import is broken on macOS 26 (Tahoe)
      # runners: it creates the temp keychain with a random password but calls
      # `security set-key-partition-list` with the certificate password, which the
      # newer OS rejects ("SecKeychainUnlock: passphrase not correct"). Import the
      # cert ourselves with one consistent keychain password and point
      # electron-builder at that keychain via CSC_KEYCHAIN instead.
      - name: Import Developer ID certificate into a dedicated keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          # Two fresh, unique, owner-only dirs (mktemp -d cannot pre-exist, so
          # neither path can be a planted symlink).
          #  - p12 dir: an EXIT trap removes it on ANY exit of this step, including
          #    an early `set -e` failure or a job cancellation, so the decoded
          #    private key never survives a failed import.
          #  - keychain dir: must persist to the signing step; its paths are exported
          #    to GITHUB_ENV BEFORE the risky commands so the always() cleanup can
          #    remove it even if this step aborts partway.
          P12DIR="$(mktemp -d "$RUNNER_TEMP/nock-p12.XXXXXX")"
          chmod 700 "$P12DIR"
          trap 'rm -rf "$P12DIR"' EXIT
          KEYDIR="$(mktemp -d "$RUNNER_TEMP/nock-kc.XXXXXX")"
          chmod 700 "$KEYDIR"
          CERT="$P12DIR/cert.p12"
          KC="$KEYDIR/signing.keychain-db"
          echo "CSC_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "SIGNING_KEYDIR=$KEYDIR" >> "$GITHUB_ENV"
          KP="$(openssl rand -hex 20)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$CERT" -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')

      - name: Build + sign macOS DMG
        env:
          # Certificate is already in CSC_KEYCHAIN (previous step); do not set
          # CSC_LINK/CSC_KEY_PASSWORD or electron-builder runs its broken import.
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Build both arm64 and x64 (build.mac.target lists both). electron-builder
        # signs + notarizes + staples the .app inside each DMG.
        run: npx electron-builder --mac --publish never

      # Notarize and staple the DMG containers too, so a downloaded DMG opens with
      # no Gatekeeper prompt (the app inside is already notarized; this covers the
      # wrapper). notarytool authenticates with the Apple ID + app-specific password
      # + team id; the values come from masked secrets.
      # Notarizing the DMG staples a ticket but does NOT sign it; a downloaded DMG
      # is still Gatekeeper-rejected ("no usable signature") without a Developer ID
      # signature. Sign the DMG (identity already in CSC_KEYCHAIN), THEN notarize
      # and staple, so the wrapper opens clean on download too.
      - name: Sign, notarize, and staple the DMGs
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for dmg in dist/*.dmg; do
            found=1
            echo "Signing $dmg"
            codesign --force --timestamp \
              --sign "Developer ID Application" --keychain "$CSC_KEYCHAIN" "$dmg"
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
          [ "$found" = 1 ] || { echo "No DMG produced to notarize"; exit 1; }

      - name: Write macOS checksums
        run: shasum -a 256 dist/*.dmg > dist/nock-terminal-mac.SHA256SUMS

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nock-terminal-mac
          path: |
            dist/*.dmg
            dist/nock-terminal-mac.SHA256SUMS

      # Remove the signing keychain even on build failure or cancellation, so the
      # imported Developer ID key never outlives the signing step. (Defense in
      # depth; the hosted runner VM is destroyed at job end regardless.)
      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi
          if [ -n "${SIGNING_KEYDIR:-}" ]; then
            rm -rf "$SIGNING_KEYDIR" || true
          fi

  build-win:
    name: Build Windows (signed NSIS installer)
    runs-on: windows-latest
    needs: preflight
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Windows signing secrets
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          test -n "$WINDOWS_CERTIFICATE"
          test -n "$WINDOWS_CERTIFICATE_PASSWORD"

      - name: Build React frontend
        run: npx vite build

      - name: Check bundle budget
        run: npm run check:bundle

      - name: Build Windows installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: Write Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/nock-terminal-win.SHA256SUMS

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nock-terminal-win
          path: |
            dist/*.exe
            dist/nock-terminal-win.SHA256SUMS

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npx vite build

      - name: Check bundle budget
        run: npm run check:bundle

      - name: Build Linux artifacts
        run: npx electron-builder --linux --publish never

      - name: Write Linux checksums
        run: sha256sum dist/*.AppImage dist/*.deb > dist/nock-terminal-linux.SHA256SUMS

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nock-terminal-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/nock-terminal-linux.SHA256SUMS

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-mac, build-win, build-linux]
    permissions:
      contents: write

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nock-terminal-mac
          path: dist/mac

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nock-terminal-win
          path: dist/win

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nock-terminal-linux
          path: dist/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/mac/*.dmg
            dist/mac/*.SHA256SUMS
            dist/win/*.exe
            dist/win/*.SHA256SUMS
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/*.SHA256SUMS
          generate_release_notes: true
